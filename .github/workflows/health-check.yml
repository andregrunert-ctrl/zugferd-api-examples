name: Live API Health Check & Validation

on:
  schedule:
    # Jeden Tag um 03:00 UTC (04:00/05:00 Uhr MEZ)
    - cron: '0 3 * * *'
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  health-check:
    name: Run Live ZUGFeRD Generation & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 1. Generate ZUGFeRD Invoice against Live API
        run: |
          python examples/generate_invoice.py
          test -s invoice_test.pdf || { echo "ERROR: invoice_test.pdf was not generated or is empty"; exit 1; }

      - name: 2. Validate Generated Invoice against Live API
        run: |
          python examples/validate_invoice.py
